# Adds the .NET Aspire Dashboard (an OTLP viewer for traces, metrics and logs) and points every service at it:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
#
# Dashboard: http://localhost:18888 (no login, local use only). Telemetry is kept in memory only.
# To send telemetry to the full Observatory stack instead, use docker-compose.observatory.yml.

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889

services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "18888:18888"

  gateway: { environment: *otel, depends_on: [aspire-dashboard] }
  orders: { environment: *otel, depends_on: [aspire-dashboard] }
  payments: { environment: *otel, depends_on: [aspire-dashboard] }
  inventory: { environment: *otel, depends_on: [aspire-dashboard] }
  notifications: { environment: *otel, depends_on: [aspire-dashboard] }
  catalog: { environment: *otel, depends_on: [aspire-dashboard] }
