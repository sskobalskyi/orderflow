name: orderflow

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  orders:
    build:
      context: .
      dockerfile: src/Orderflow.Orders/Dockerfile
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=orderflow;Username=orderflow;Password=orderflow
      RabbitMq__Host: rabbitmq
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
