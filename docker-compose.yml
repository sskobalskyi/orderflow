name: orderflow

x-service: &service
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  orders:
    <<: *service
    build: { context: ., args: { SERVICE: Orders } }
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=orders;Username=orderflow;Password=orderflow
      Redis__Configuration: redis:6379
      Catalog__BaseUrl: http://catalog:8080
      RabbitMq__Host: rabbitmq

  catalog:
    <<: *service
    build: { context: ., args: { SERVICE: Catalog } }
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=catalog;Username=orderflow;Password=orderflow
    ports: ["8084:8080"]

  payments:
    <<: *service
    build: { context: ., args: { SERVICE: Payments } }
    environment:
      ConnectionStrings__Payments: Host=postgres;Database=payments;Username=orderflow;Password=orderflow
      RabbitMq__Host: rabbitmq

  notifications:
    <<: *service
    build: { context: ., args: { SERVICE: Notifications } }
    environment:
      ConnectionStrings__Notifications: Host=postgres;Database=notifications;Username=orderflow;Password=orderflow
      RabbitMq__Host: rabbitmq
    ports: ["8083:8080"]

  inventory:
    <<: *service
    build: { context: ., args: { SERVICE: Inventory } }
    environment:
      ConnectionStrings__Inventory: Host=postgres;Database=inventory;Username=orderflow;Password=orderflow
      RabbitMq__Host: rabbitmq
    ports: ["8082:8080"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes: ["./keycloak/orderflow-realm.json:/opt/keycloak/data/import/orderflow-realm.json:ro"]
    ports: ["8180:8080"]

  gateway:
    build: { context: ., args: { SERVICE: Gateway } }
    environment:
      Auth__MetadataAddress: http://keycloak:8080/realms/orderflow/.well-known/openid-configuration
      Auth__Issuer: http://localhost:8180/realms/orderflow
      ReverseProxy__Clusters__orders__Destinations__d1__Address: http://orders:8080
      ReverseProxy__Clusters__catalog__Destinations__d1__Address: http://catalog:8080
    ports: ["8080:8080"]
    depends_on: [orders, catalog, keycloak]

  web:
    build: { context: ./web }
    ports: ["5173:80"]
    depends_on: [gateway]

volumes:
  pgdata:
