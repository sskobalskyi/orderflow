name: orderflow

x-service: &service
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  orders:
    <<: *service
    build: { context: ., args: { SERVICE: Orders } }
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=orders;Username=orderflow;Password=orderflow
      Redis__Configuration: redis:6379
      RabbitMq__Host: rabbitmq
    ports: ["8081:8080"]

  payments:
    <<: *service
    build: { context: ., args: { SERVICE: Payments } }
    environment:
      ConnectionStrings__Payments: Host=postgres;Database=payments;Username=orderflow;Password=orderflow
      RabbitMq__Host: rabbitmq

  notifications:
    <<: *service
    build: { context: ., args: { SERVICE: Notifications } }
    environment:
      ConnectionStrings__Notifications: Host=postgres;Database=notifications;Username=orderflow;Password=orderflow
      RabbitMq__Host: rabbitmq
    ports: ["8083:8080"]

  inventory:
    <<: *service
    build: { context: ., args: { SERVICE: Inventory } }
    environment:
      ConnectionStrings__Inventory: Host=postgres;Database=inventory;Username=orderflow;Password=orderflow
      RabbitMq__Host: rabbitmq
    ports: ["8082:8080"]

volumes:
  pgdata:
