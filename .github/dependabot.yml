version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # MassTransit v9 is commercial; stay on the Apache-2.0 v8 line.
    ignore:
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*", "Npgsql.OpenTelemetry"]
      efcore:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql.EntityFrameworkCore*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Runtime majors are deliberate upgrades: the projects target .NET 9 and Node 24.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
